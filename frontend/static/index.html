<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIPPit</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="container">
    <h1>RIPPit</h1>

    <section class="card">
      <form id="download-form">
        <label>URL
          <div class="row" style="gap:.5rem; align-items:center;">
            <input id="url" type="url" placeholder="Paste a link or playlist (YouTube, SoundCloud, TikTok, Instagram, X/Twitter, NTS…)" required style="flex:1;" />
          </div>
        </label>

        <div class="row">
          <label>Format
            <div class="format-select">
              <select id="container">
                <optgroup label="Audio">
                  <option value="mp3" data-info="mp3; 320 kbps CBR; legacy compatibility">MP3</option>
                  <option value="aac" data-info="m4a; AAC-LC VBR ~256 kbps; broad support">AAC (m4a)</option>
                  <option value="opus" data-info="webm; Opus VBR ~160 kbps; native on YouTube">Opus (251)</option>
                  <option value="original" data-info="original container/codec; no re-encode">Source</option>
                </optgroup>
                <optgroup label="Video">
                  <option value="mp4" data-info="mp4; widest compatibility; often ≤1080p on YouTube">MP4 (H.264 + AAC)</option>
                  <option value="auto" data-info="highest video+audio available; prefers AV1 > VP9 > H.264">Best</option>
                </optgroup>
              </select>
              <div class="format-info-bubble" id="format-info-text" aria-live="polite"></div>
            </div>
          </label>
          <label class="row" id="force-mp4-wrap" style="display:none;">
            <input id="force_mp4" type="checkbox" checked />
          </label>
        </div>

        <div class="row">
          <!-- moved to playlist side panel -->
        </div>

        <div class="row">
          <button type="submit">Download</button>
        </div>
      </form>
    </section>

    <section class="card">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem;">
        <h2 style="margin:0;">Downloads</h2>
        <button id="open-downloads-folder" style="padding:0.5rem 1rem;">Open folder</button>
      </div>
      <div id="jobs"></div>
    </section>

    <!-- Playlist side panel -->
    <aside id="panel" class="panel hidden">
      <div class="panel-header">
        <strong>Playlist items</strong>
        <button id="panel-close">✕</button>
      </div>
      <div class="panel-body">
        <div class="row" style="justify-content:space-between; margin-bottom:.5rem;">
          <label class="row"><input type="checkbox" id="panel-select-all" /> Select all</label>
        </div>
        <div id="panel-list" class="panel-list"></div>
      </div>
    </aside>
  </div>

  <script src="/static/main.js?t=9"></script>
</body>
</html>
